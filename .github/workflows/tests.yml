name: Tests

on:
  push:
  pull_request:

jobs:
  # The unit suite runs with nothing beyond the extensions composer.json
  # requires. mbstring is deliberately absent: the framework's UTF-8 handling
  # is built on PCRE so that it works on a bare PHP build, and this job is what
  # keeps that true.
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo
          coverage: none
      - run: composer install --prefer-dist --no-progress
      # Full validation, publish checks included: this package is published,
      # so a composer.json that Packagist would refuse has to fail here rather
      # than at the moment somebody tries to install it.
      - run: composer validate --strict
      - run: composer run lint
      - run: composer run test

      # The documentation exists in English, Portuguese and Spanish, and a
      # version that falls behind is worse than one that does not exist,
      # because a reader cannot tell which pages are current. This compares
      # the structure of the three and checks every link.
      - run: composer run docs

  # tests/db.php checks the schema builder against real servers. It has always
  # existed but nothing ever ran it, so dialect bugs could only be found by
  # hand. Both engines run here because the builder promises parity between
  # them.
  integration:
    name: Schema against ${{ matrix.database }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sfphp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sfphp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # The cache, the session handler over it and the queue driver are all
      # written against a real server's API. None of them had a test that ran
      # against one, and the queue driver was losing every job id.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pdo, pdo_mysql, pdo_pgsql, redis
          coverage: none
      - run: composer install --prefer-dist --no-progress

      - name: Run schema integration tests
        env:
          SFPHP_TEST_MYSQL_DSN: ${{ matrix.database == 'mysql' && 'mysql:host=127.0.0.1;port=3306;dbname=sfphp_test' || '' }}
          SFPHP_TEST_MYSQL_USER: root
          SFPHP_TEST_MYSQL_PASS: secret
          SFPHP_TEST_PGSQL_DSN: ${{ matrix.database == 'pgsql' && 'pgsql:host=127.0.0.1;port=5432;dbname=sfphp_test' || '' }}
          SFPHP_TEST_PGSQL_USER: postgres
          SFPHP_TEST_PGSQL_PASS: secret
          SFPHP_TEST_REDIS_HOST: 127.0.0.1
          SFPHP_TEST_REDIS_PORT: 6379
        run: composer run test:db
